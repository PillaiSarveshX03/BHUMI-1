<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <header>
        <nav>
            <div class="navbar">
                <div class="logo notranslate" translate="no">
                    <span class="hindi">भूमि</span>
                    <span class="english">BHUMI</span>
                </div>
                <div class="nav-links" style="align-items: center;">
                    <select class="custom-lang-selector" onchange="changeLanguage(this.value)">
                        <option value="en">English</option>
                        <option value="mr">Marathi</option>
                    </select>
                    <div id="google_translate_element" style="width:0;height:0;overflow:hidden;position:absolute;"></div>
                    <a href="../index.html" class="nav-link">HOME</a>
                    <a href="about.html" class="nav-link">ABOUT</a>
                    <a href="services.html" class="nav-link">SERVICES</a>
                    <a href="database.html" class="nav-link">DATABASE</a>
                    <a href="contact.html" class="nav-link">CONTACT</a>
                </div>
            </div>
        </nav>
    </header>
    <section class="contact-section" id="contact">
        <div class="contact-container">

            <div class="contact-info">
                <span class="contact-tag">GET IN TOUCH</span>

                <h2>LET'S <span>CONNECT</span></h2>

                <p>
                    Have a question, suggestion, or want to know more about
                    India's agricultural heritage? We'd love to hear from you.
                </p>

                <div class="contact-details">

                    <div class="contact-item">
                        <div class="contact-icon">✉</div>
                        <div>
                            <h4>Email</h4>
                            <p>vedantsane784@gmail.com</p>
                        </div>
                    </div>

                    <div class="contact-item">
                        <div class="contact-icon">☎</div>
                        <div>
                            <h4>Phone</h4>
                            <p>+91 79770 59336</p>
                        </div>
                    </div>

                    <div class="contact-item">
                        <div class="contact-icon">⌖</div>
                        <div>
                            <h4>Location</h4>
                            <p>India</p>
                        </div>
                    </div>

                </div>
            </div>

            <div class="contact-form-box">

                <form id="contactForm">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">NAME</label>
                            <input type="text" id="name" placeholder="Your name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" placeholder="Your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="subject">SUBJECT</label>
                        <input type="text" id="subject" placeholder="What's this about?" required>
                    </div>

                    <div class="form-group">
                        <label for="message">MESSAGE</label>
                        <textarea id="message" rows="6" placeholder="Write your message..." required></textarea>
                    </div>

                    <button type="submit" class="contact-btn">
                        SEND MESSAGE <span>→</span>
                    </button>

                    <p id="formMessage"></p>

                </form>

            </div>

        </div>
    </section>

    <script src="../script.js"></script>
    <script>
        document.getElementById("contactForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const subject = document.getElementById("subject").value;
            const message = document.getElementById("message").value;
            const msgEl = document.getElementById("formMessage");
            const btn = document.querySelector(".contact-btn");
            
            btn.innerHTML = "SENDING...";
            btn.disabled = true;
            
            try {
                // Since script.js is loaded, API_BASE_URL might be available.
                // However script.js wraps it in DOMContentLoaded and doesn't export it globally,
                // so we hardcode it here or define it globally in script.js. I'll hardcode it here.
                const url = "http://127.0.0.1:5000/api/contact";
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, subject, message })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    msgEl.style.color = "green";
                    msgEl.textContent = data.message || "Message sent successfully!";
                    this.reset();
                } else {
                    msgEl.style.color = "red";
                    msgEl.textContent = data.error || "Failed to send message.";
                }
            } catch (err) {
                msgEl.style.color = "red";
                msgEl.textContent = "Error connecting to the server.";
            } finally {
                btn.innerHTML = "SEND MESSAGE <span>→</span>";
                btn.disabled = false;
            }
        });
    </script>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,mr'
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
